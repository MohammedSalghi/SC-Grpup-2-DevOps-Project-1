# SonarQube Configuration for E-Doc Code Smell Detection
# Part B Requirement #3: Code Smell Detection Methods

# Project Information
sonar.projectKey=edoc-appointment-system
sonar.projectName=E-Doc Doctor Appointment System  
sonar.projectVersion=1.0
sonar.organization=sc-group-2

# Source Code Locations
sonar.sources=original-system/,refactored-system/src/,refactored-system/public/
sonar.language=php
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=vendor/**,tests/**,node_modules/**,docs/**,performance-testing/**

# Test Locations  
sonar.tests=refactored-system/tests/
sonar.test.inclusions=**/*Test.php,**/*test.php

# Code Coverage
sonar.php.coverage.reportPaths=coverage.xml
sonar.php.tests.reportPath=test-results.xml

# Quality Gate Settings
sonar.qualitygate.wait=true

# Code Smell Detection Rules
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5

# Rule 1: SQL Injection Detection (Critical Security Issue)
sonar.issue.ignore.multicriteria.e1.ruleKey=php:S2077
sonar.issue.ignore.multicriteria.e1.resourceKey=original-system/**

# Rule 2: God Class Detection (Major Maintainability Issue)  
sonar.issue.ignore.multicriteria.e2.ruleKey=php:S138
sonar.issue.ignore.multicriteria.e2.resourceKey=original-system/**

# Rule 3: Code Duplication Detection (Major Maintainability Issue)
sonar.issue.ignore.multicriteria.e3.ruleKey=common-php:DuplicatedBlocks
sonar.issue.ignore.multicriteria.e3.resourceKey=original-system/**

# Rule 4: Complexity Detection (Major Maintainability Issue)
sonar.issue.ignore.multicriteria.e4.ruleKey=php:S1541
sonar.issue.ignore.multicriteria.e4.resourceKey=original-system/**

# Rule 5: Security Hotspots Detection
sonar.issue.ignore.multicriteria.e5.ruleKey=php:S4817
sonar.issue.ignore.multicriteria.e5.resourceKey=original-system/**

# Duplication Detection Settings
sonar.cpd.php.minimumtokens=30
sonar.cpd.php.minimumlines=5

# Security Analysis Settings
sonar.security.hotspots.enable=true
sonar.security.review.enable=true

